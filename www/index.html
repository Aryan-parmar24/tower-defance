body { background:#0a0a1a; touch-action:none; user-select:none; -webkit-user-select:none }
canvas { display:block; }

/* Rotate screen */
#rotateMsg {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;

.rot-icon { font-size:60px; animation:rot 1.5s ease-in-out infinite; }

.rot-t { color:#f1c40f; font-family:Arial; font-size:20px; font-weight:bold; }
.rot-s { color:#aaa; font-family:Arial; font-size:13px; text-align:center; padding:0 30px; }

/* Auth UI */
#ui {
    position:fixed; top:0; left:0; width:100%; height:100%;

    background:linear-gradient(135deg,#050510,#1a1a3a);
}
.box {
    background:rgba(255,255,255,0.05);

input {

input:focus { border-color:#f1c40f }
input::placeholder { color:#666 }
.btn {
    width:100%; padding:13px; border-radius:10px; border:none;
    font-size:15px; font-weight:bold; font-family:Arial;
    cursor:pointer; margin-bottom:8px; transition:opacity 0.2s; box-sizing:border-box;

.btn:active { opacity:0.75 }
.btn-green { background:linear-gradient(135deg,#27ae60,#1e8449); color:white }
.btn-ghost { background:rgba(255,255,255,0.07); color:#aaa; font-size:13px }

.sw { color:#aaa; font-family:Arial; font-size:12px; text-align:center; margin-top:8px }
.sw span { color:#f1c40f; cursor:pointer; font-weight:bold }
.divider { display:flex; align-items:center; gap:10px; margin:8px 0; color:#444; font-family:Arial; font-size:12px }

.spin { width:36px; height:36px; border:3px solid rgba(255,255,255,0.1); border-top-color:#f1c40f; border-radius:50%; animation:sp 0.8s linear infinite; margin:0 auto }

<script>
const SUPABASE_URL = "https://rlohtodqxxgwveeahmzz.supabase.co";
const SUPABASE_KEY = "sb_publishable_D9MV9BJ9eFq1FEdbEu_J7g_xOEcynW8";

let supabaseClient, currentUser, isGuest = false;
let authMode = "signin";

function initSupabase(){
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { autoRefreshToken:true, persistSession:true, detectSessionInUrl:false, storageKey:'tower-defense-auth' }
        });
        console.log("✅ Supabase connected!");
        checkSession();
    } catch(e) {
        console.error("❌ Supabase error:", e);
        setErr("Connection failed.");
        hideLoad();
    }
}
window.addEventListener('load', initSupabase);

async function checkSession(){
    showLoad("Checking login...");
    try {
        const {data:{session}} = await supabaseClient.auth.getSession();
        if(session){ currentUser=session.user; await loadAndStart(); }
        else hideLoad();
        supabaseClient.auth.onAuthStateChange(async(event,session)=>{
            if(event==='SIGNED_IN'&&session){ currentUser=session.user; await loadAndStart(); }
            if(event==='SIGNED_OUT'){ currentUser=null; document.getElementById('ui').style.display='flex'; document.getElementById('authBox').style.display='block'; hideLoad(); }
        });
    } catch(e){ console.log(e); hideLoad(); }
}

function switchTab(mode){
    authMode=mode;
    document.getElementById('tabSignin').className='tab'+(mode==='signin'?' active':'');
    document.getElementById('tabSignup').className='tab'+(mode==='signup'?' active':'');
    document.getElementById('nameInp').style.display=mode==='signup'?'block':'none';
    document.getElementById('mainBtn').textContent=mode==='signup'?'Create Account':'Sign In';
    document.getElementById('swText').innerHTML=mode==='signup'?'Have account? <span onclick="switchTab(\'signin\')">Sign In</span>':'No account? <span onclick="switchTab(\'signup\')">Sign Up</span>';
    setErr('');
}
function setErr(m){document.getElementById('errMsg').textContent=m}
function showLoad(m){document.getElementById('authBox').style.display='none';document.getElementById('loadBox').style.display='block';document.getElementById('loadMsg').textContent=m||'Loading...'}
function hideLoad(){document.getElementById('loadBox').style.display='none';document.getElementById('authBox').style.display='block'}

async function doAuth(){
    setErr('');
    let email=document.getElementById('emailInp').value.trim();
    let pass=document.getElementById('passInp').value;
    let name=document.getElementById('nameInp').value.trim();
    if(!email||!pass){setErr('Please fill email and password');return}
    if(pass.length<6){setErr('Password must be 6+ characters');return}
    if(authMode==='signup'&&!name){setErr('Please enter your name');return}
    document.getElementById('mainBtn').textContent='Please wait...';
    document.getElementById('mainBtn').disabled=true;
    try {
        if(authMode==='signup'){
            let{data,error}=await supabaseClient.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
            if(error)throw error;
            if(data.user&&!data.session){setErr('✅ Check email to confirm!');document.getElementById('mainBtn').textContent='Create Account';document.getElementById('mainBtn').disabled=false;return}
        } else {
            let{error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
            if(error)throw error;
        }
    } catch(e){
        let msg=e.message;
        if(msg.includes('Invalid login'))msg='Wrong email or password';
        if(msg.includes('already registered'))msg='Email already in use';
        setErr(msg);
        document.getElementById('mainBtn').textContent=authMode==='signup'?'Create Account':'Sign In';
        document.getElementById('mainBtn').disabled=false;
    }
}

async function doGuest(){
    isGuest=true;
    document.getElementById('ui').style.display='none';
    startGame({gems:50,max_level:1,unlocked_machines:[0,1,2],machine_upgrades:{},total_gems:0,display_name:'Guest',selected_deck:[0,1,2]});
}

async function loadAndStart(){
    showLoad("Loading save data...");
    document.getElementById('ui').style.display='flex';
    try {
        let{data,error}=await supabaseClient.from('game_saves').select('*').eq('user_id',currentUser.id).single();
        if(error&&error.code==='PGRST116'){
            let newSave={user_id:currentUser.id,gems:50,max_level:1,unlocked_machines:[0,1,2],machine_upgrades:{},total_gems:0,display_name:currentUser.user_metadata?.display_name||currentUser.email?.split('@')[0]||'Player',selected_deck:[0,1,2]};
            let{data:created}=await supabaseClient.from('game_saves').insert(newSave).select().single();
            data=created||newSave;
        }
        document.getElementById('ui').style.display='none';
        startGame(data||{gems:50,max_level:1,unlocked_machines:[0,1,2],machine_upgrades:{},total_gems:0,selected_deck:[0,1,2]});
    } catch(e){
        console.log('Load error:',e);
        document.getElementById('ui').style.display='none';
        startGame({gems:50,max_level:1,unlocked_machines:[0,1,2],machine_upgrades:{},total_gems:0,selected_deck:[0,1,2]});
    }
}

let saveTimeout=null;
async function saveGame(data){
    if(isGuest||!currentUser)return;
    clearTimeout(saveTimeout);
    saveTimeout=setTimeout(async()=>{
        try {
            await supabaseClient.from('game_saves').upsert({
                user_id:currentUser.id,
                gems:data.gems||0,
                max_level:data.maxLevel||1,
                unlocked_machines:data.unlockedMachines||[0,1,2],
                machine_upgrades:data.machineUpgrades||{},
                total_gems:data.totalGems||0,
                selected_deck:data.selectedDeck||[0,1,2],
                updated_at:new Date().toISOString()
            },{onConflict:'user_id'});
            console.log('💾 Saved!');
        } catch(e){console.log('Save error:',e)}
    },1500);
}

async function signOut(){
    await saveGame({gems:window.gameGems||50,maxLevel:window.gameMaxLevel||1,unlockedMachines:window.gameUnlocked||[0,1,2],machineUpgrades:window.gameMachineUpgrades||{},totalGems:window.gameTotalGems||0,selectedDeck:window.gameSelectedDeck||[0,1,2]});
    await supabaseClient.auth.signOut();
    location.reload();
}

    function drawMI(x,y,mid,sc){

        ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fillStyle=m.color+"44";ctx.fill();
        ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fillStyle="#1a1a2e";ctx.fill();ctx.strokeStyle=m.color;ctx.lineWidth=2.5;ctx.stroke();
        let n=m.name;
        if(n.includes("Arrow")){ctx.strokeStyle="#FFD700";ctx.lineWidth=2;ctx.beginPath();ctx.arc(-2,0,7,-1,1);ctx.stroke();ctx.strokeStyle="#FFF";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(7,0);ctx.stroke();ctx.fillStyle="#FF4444";ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(4,-3);ctx.lineTo(4,3);ctx.closePath();ctx.fill()}
        else if(n.includes("Cannon")){ctx.fillStyle="#FF6B6B";ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#FFD700";ctx.beginPath();ctx.arc(3,-5,2,0,Math.PI*2);ctx.fill()}
        else if(n.includes("Wall")){ctx.fillStyle="#90A4AE";ctx.fillRect(-7,-7,14,14);ctx.strokeStyle="#607D8B";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(7,-2);ctx.moveTo(-7,3);ctx.lineTo(7,3);ctx.stroke()}
        else if(n.includes("Ice")||n.includes("Freeze")||n.includes("Frost")){ctx.strokeStyle="#00E5FF";ctx.lineWidth=2;for(let i=0;i<3;i++){let a=(i/3)*Math.PI;ctx.beginPath();ctx.moveTo(Math.cos(a)*-7,Math.sin(a)*-7);ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7);ctx.stroke()}ctx.fillStyle="#FFF";ctx.beginPath();ctx.arc(0,0,2.5,0,Math.PI*2);ctx.fill()}
        else if(n.includes("Fire")||n.includes("Flame")||n.includes("Inferno")||n.includes("Dragon")||n.includes("Demon")){ctx.fillStyle="#FF1744";ctx.beginPath();ctx.moveTo(0,-8);ctx.bezierCurveTo(6,-5,6,3,0,8);ctx.bezierCurveTo(-6,3,-6,-5,0,-8);ctx.fill();ctx.fillStyle="#FFEA00";ctx.beginPath();ctx.moveTo(0,-1);ctx.bezierCurveTo(1.5,0,1.5,2,0,4);ctx.bezierCurveTo(-1.5,2,-1.5,0,0,-1);ctx.fill()}
        else if(n.includes("Tesla")||n.includes("Thunder")||n.includes("Storm")){ctx.fillStyle="#FFD600";ctx.beginPath();ctx.moveTo(-1,-8);ctx.lineTo(3,-1);ctx.lineTo(0,-1);ctx.lineTo(2,8);ctx.lineTo(-3,1);ctx.lineTo(0,1);ctx.closePath();ctx.fill()}
        else if(n.includes("Bomb")||n.includes("Nuke")||n.includes("Mortar")){ctx.fillStyle="#333";ctx.beginPath();ctx.arc(0,1,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#FF6B00";ctx.beginPath();ctx.arc(4,-8,2.5,0,Math.PI*2);ctx.fill()}
        else if(n.includes("Sniper")){ctx.strokeStyle="#00FFAB";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="#FFF";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(0,9);ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.stroke();ctx.fillStyle="#FF1744";ctx.beginPath();ctx.arc(0,0,2,0,Math.PI*2);ctx.fill()}
        else if(n.includes("Laser")||n.includes("Plasma")||n.includes("Death")){let lg=ctx.createRadialGradient(0,0,0,0,0,7);lg.addColorStop(0,"#FFF");lg.addColorStop(0.3,m.color);lg.addColorStop(1,m.color+"66");ctx.fillStyle=lg;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill()}

        else if(n.includes("Omega")||n.includes("God")||n.includes("World")||n.includes("Infinity")||n.includes("Quantum")||n.includes("Crystal")){let ug=ctx.createRadialGradient(0,0,0,0,0,9);ug.addColorStop(0,"#FFF");ug.addColorStop(0.4,m.color);ug.addColorStop(1,"transparent");ctx.fillStyle=ug;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#FFF";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.stroke()}

    // =================== LEVEL GEN ===================
    function genLvl(n){mapCols=Math.min(60,22+Math.floor(n/5)*3);mapRows=Math.min(30,10+Math.floor(n/8)*2);let path=[],cx=0,cy=Math.floor(mapRows/2);path.push({x:cx,y:cy});let segs=Math.min(16,3+Math.floor(n/4));for(let i=0;i<segs;i++){let mr=Math.min(mapCols-2,cx+3+Math.floor(Math.random()*(2+Math.floor(n/8))));path.push({x:mr,y:cy});cx=mr;if(i<segs-1){let ny=cy<mapRows/3?Math.min(mapRows-2,cy+2+Math.floor(Math.random()*3)):cy>mapRows*2/3?Math.max(1,cy-2-Math.floor(Math.random()*3)):Math.random()>0.5?Math.min(mapRows-2,cy+2+Math.floor(Math.random()*3)):Math.max(1,cy-2-Math.floor(Math.random()*3));path.push({x:cx,y:ny});cy=ny}}path.push({x:mapCols-1,y:cy});let clean=[path[0]];for(let i=1;i<path.length;i++){let l=clean[clean.length-1];if(path[i].x!==l.x||path[i].y!==l.y)clean.push(path[i])}let themes=[{name:"Green Valley",bg:"#1a3a1a"},{name:"Desert Storm",bg:"#3a2a0a"},{name:"Ice Mountain",bg:"#0a1a3a"},{name:"Lava Fields",bg:"#3a0a0a"},{name:"Dark Forest",bg:"#0a1a0a"},{name:"Crystal Cave",bg:"#1a0a3a"},{name:"Swamp Land",bg:"#1a2a0a"},{name:"Volcano",bg:"#2a0500"},{name:"Shadow Realm",bg:"#050510"},{name:"Sky Fort",bg:"#0a1a2a"}];let t=themes[n%themes.length];return{path:clean,waves:Math.min(20,3+Math.floor(n/3)),bg:t.bg,name:t.name+" "+(Math.floor(n/10)+1)}}
    function buildPath(p){pathCells=new Set();for(let i=0;i<p.length-1;i++){let a=p[i],b=p[i+1],dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y),cx=a.x,cy=a.y;while(cx!==b.x||cy!==b.y){pathCells.add(cx+","+cy);cx+=dx;cy+=dy}pathCells.add(b.x+","+b.y)}}
    function startLevel(n){
        currentLevel=n;let l=genLvl(n);currentPath=l.path;totalWaves=l.waves;
        lives=getLives();escaped=0;wave=0;score=0;
        gameCoins=200+Math.floor(currentLevel/5)*25;
        towers=[];enemies=[];bullets=[];particles=[];
        waveActive=false;enemiesSpawned=0;spawnTimer=0;selectedPlacedTower=null;
        cam={x:0,y:0};buildPath(currentPath);
        if(playerData.selectedDeck.length>0)selectedMachineId=playerData.selectedDeck[0];
        gameState="playing";showMsg("⚔️ Level "+(n+1)+": "+l.name,250);
    }

    function createE(type,w){

        let lvlMult=1+(currentLevel*0.15)+(w*0.18);
        let base={x:currentPath[0].x*CELL+CELL/2,y:currentPath[0].y*CELL+CELL/2,pathIndex:0,slowed:0,burning:0,poisoned:0,attackTimer:0};
        let types={
            basic:    {hp:100, speed:1.3, color:"#e74c3c",reward:8, size:12,name:"Grunt",    atkDmg:0},
            fast:     {hp:50,  speed:3.2, color:"#f39c12",reward:10,size:10,name:"Runner",   atkDmg:0},

            flying:   {hp:70,  speed:2.5, color:"#a29bfe",reward:16,size:11,name:"Flyer",   atkDmg:3,  atkRate:70},
            bomber:   {hp:140, speed:1.2, color:"#fdcb6e",reward:28,size:15,name:"Bomber",  atkDmg:15, atkRate:130},
            healer:   {hp:100, speed:1.1, color:"#55efc4",reward:20,size:13,name:"Healer",  atkDmg:0,  heals:true},
            boss:     {hp:900, speed:0.5, color:"#6c5ce7",reward:70,size:28,name:"Boss",    atkDmg:12, atkRate:70},
            mega:     {hp:2500,speed:0.35,color:"#2d3436",reward:150,size:34,name:"MegaBoss",atkDmg:20,atkRate:55},
            ghost:    {hp:65,  speed:2.0, color:"#dfe6e9",reward:14,size:11,name:"Ghost",   atkDmg:5,  atkRate:100,ghost:true},
            berserker:{hp:180, speed:1.8, color:"#d63031",reward:35,size:16,name:"Berserker",atkDmg:10,atkRate:45},
            // NEW harder enemies
            armored:  {hp:500, speed:0.6, color:"#455a64",reward:40,size:20,name:"Armored", atkDmg:8,  atkRate:80},
            speedster:{hp:40,  speed:4.0, color:"#ff6b6b",reward:18,size:9, name:"Speedster",atkDmg:0},
        };
        let t=types[type]||types.basic;
        return{
            ...base,
            hp:Math.floor(t.hp*lvlMult),
            maxHp:Math.floor(t.hp*lvlMult),
            speed:t.speed+(currentLevel>20?0.2:0)+(currentLevel>50?0.3:0),
            color:t.color,
            reward:t.reward+Math.floor(currentLevel/3),
            gemReward:Math.floor((t.reward+currentLevel)/8),
            size:t.size,name:t.name,
            atkDmg:Math.floor((t.atkDmg||0)*(1+currentLevel*0.08)),
            atkRate:t.atkRate||999,
            heals:t.heals||false,
            ghost:t.ghost||false

    // =================== INPUT ===================
    let keys={};
    window.addEventListener("keydown",e=>{
        keys[e.key]=true;
        if(e.key==="Escape"&&gameState==="playing")gameState="paused";
        else if(e.key==="Escape"&&gameState==="paused")gameState="playing";
        // Arrow keys for map scroll
        if(gameState==="playing"){
            let sp=10;
            if(e.key==="ArrowLeft")cam.x=Math.max(0,cam.x-sp);
            if(e.key==="ArrowRight")cam.x=Math.min(mapCols*CELL-W,cam.x+sp);
            if(e.key==="ArrowUp")cam.y=Math.max(0,cam.y-sp);
            if(e.key==="ArrowDown")cam.y=Math.min(mapRows*CELL-(H-getBotH()-getTopH()),cam.y+sp);
        }
    });
    window.addEventListener("keyup",e=>keys[e.key]=false);

    // =================== MOUSE SCROLL FOR MAP ===================
    canvas.addEventListener("wheel",e=>{
        e.preventDefault();
        if(gameState==="playing"){
            // Scroll map with mouse wheel
            if(e.shiftKey){
                // Horizontal scroll with Shift+wheel
                cam.x=Math.max(0,Math.min(mapCols*CELL-W,cam.x+e.deltaY*1.5));
            }else{
                cam.y=Math.max(0,Math.min(mapRows*CELL-(H-getBotH()-getTopH()),cam.y+e.deltaY*1.5));
            }
        }
        if(gameState==="store"||gameState==="deckBuilder"){
            storeScroll=Math.max(0,storeScroll+e.deltaY*0.8);
        }
    },{passive:false});

    // =================== MOUSE DRAG FOR MAP ===================
    canvas.addEventListener("mousedown",e=>{
        if(gameState==="playing"&&e.button===1){
            // Middle mouse drag
            isMapDragging=true;
            mapDragStart={x:e.clientX,y:e.clientY};
            mapCamStart={x:cam.x,y:cam.y};
            e.preventDefault();
        }
        if(gameState==="playing"&&e.button===2){
            // Right click drag to scroll map
            isMapDragging=true;
            mapDragStart={x:e.clientX,y:e.clientY};
            mapCamStart={x:cam.x,y:cam.y};
        }
    });
    canvas.addEventListener("mousemove",e=>{
        if(isMapDragging&&gameState==="playing"){
            let dx=e.clientX-mapDragStart.x;
            let dy=e.clientY-mapDragStart.y;
            cam.x=Math.max(0,Math.min(mapCols*CELL-W,mapCamStart.x-dx));
            cam.y=Math.max(0,Math.min(mapRows*CELL-(H-getBotH()-getTopH()),mapCamStart.y-dy));
        }
        if(!isMapDragging&&gameState==="playing"&&!isMobile){
            let topH=getTopH(),botH=getBotH();
            if(e.clientY>topH&&e.clientY<H-botH){
                previewCol=Math.floor((e.clientX+cam.x)/CELL);
                previewRow=Math.floor((e.clientY+cam.y)/CELL);
                canPlace=validP(previewCol,previewRow)&&gameCoins>=getPlaceCost(selectedMachineId);
            }else{previewCol=-1;previewRow=-1}

            // Edge scrolling on desktop
            let edge=50,sp=4;
            if(e.clientX<edge)cam.x=Math.max(0,cam.x-sp);
            if(e.clientX>W-edge)cam.x=Math.min(mapCols*CELL-W,cam.x+sp);
            if(e.clientY>topH&&e.clientY<topH+edge)cam.y=Math.max(0,cam.y-sp);
            if(e.clientY>H-botH-edge&&e.clientY<H-botH)cam.y=Math.min(mapRows*CELL-(H-getBotH()-getTopH()),cam.y+sp);
        }
    });
    canvas.addEventListener("mouseup",e=>{isMapDragging=false});
    canvas.addEventListener("mouseleave",e=>{isMapDragging=false});
    canvas.addEventListener("contextmenu",e=>e.preventDefault());

    function handleClick(mx,my){
        // PAUSED
        if(gameState==="paused"){let pw=Math.min(300,W-30),ph=!isGuest?310:270,bw=pw-36,bh=44,bx=W/2-bw/2,py=H/2-ph/2,btnY=py+108;if(mx>bx&&mx<bx+bw&&my>btnY&&my<btnY+bh){gameState="playing";return}btnY+=bh+10;if(mx>bx&&mx<bx+bw&&my>btnY&&my<btnY+bh){startLevel(currentLevel);return}btnY+=bh+10;if(mx>bx&&mx<bx+bw&&my>btnY&&my<btnY+bh){triggerSave();gameState="menu";navTab="play";return}btnY+=bh+10;if(!isGuest&&mx>bx&&mx<bx+bw&&my>btnY&&my<btnY+bh){signOut();return}return}

        // NAVBAR CLICKS (for menu screens)
        let navH=getNavH();
        let menuStates=["menu","levelSelect","deckBuilder","store","profile"];
        if(menuStates.includes(gameState)&&my>H-navH){
            let navItems=["play","levels","deck","store","profile"];
            let nw=W/navItems.length;
            let idx=Math.floor(mx/nw);
            if(idx>=0&&idx<navItems.length){
                navTab=navItems[idx];
                if(navTab==="play"){gameState="menu"}
                else if(navTab==="levels"){gameState="levelSelect";levelSelectPage=0;storeScroll=0}
                else if(navTab==="deck"){gameState="deckBuilder";storeScroll=0}
                else if(navTab==="store"){gameState="store";storeTab="Common";storeScroll=0}
                else if(navTab==="profile"){gameState="profile"}
                return;
            }
        }

        // MENU
        if(gameState==="menu"){
            let bw=isSmall?170:210,bx=W/2-bw/2,bh=isSmall?42:48;
            let contentH=H-navH,cy=contentH/2;
            if(mx>bx&&mx<bx+bw&&my>cy-5&&my<cy-5+bh){
                // Play button - go to deck builder first if needed
                startLevel(playerData.maxLevel-1);
                return;
            }
            return;
        }

        // LEVEL SELECT
        if(gameState==="levelSelect"){
            let navH2=getNavH(),tp=Math.ceil(200/(isSmall?10:20));
            if(levelSelectPage>0&&mx>W/2-120&&mx<W/2-65&&my>H-navH2-40&&my<H-navH2-14){levelSelectPage--;return}
            if(levelSelectPage<tp-1&&mx>W/2+65&&mx<W/2+120&&my>H-navH2-40&&my<H-navH2-14){levelSelectPage++;return}
            let pp=isSmall?10:20,cols=isSmall?2:5;
            let cw=isSmall?Math.floor((W-30)/2-6):Math.floor((W-30)/5-6),ch=isSmall?68:85,gap=8;
            let tW=cols*(cw+gap),sX=W/2-tW/2,sY=65,start=levelSelectPage*pp;
            for(let i=start;i<Math.min(200,start+pp);i++){
                let idx=i-start,col=idx%cols,row=Math.floor(idx/cols);
                let cx=sX+col*(cw+gap),cy=sY+row*(ch+gap);
                if(i<playerData.maxLevel&&mx>cx&&mx<cx+cw&&my>cy&&my<cy+ch){startLevel(i);return}
            }
            return;
        }

        // DECK BUILDER
        if(gameState==="deckBuilder"){
            // Confirm button
            if(mx>W/2-80&&mx<W/2+80&&my>H-55&&my<H-17){
                if(playerData.selectedDeck.length>=1){
                    triggerSave();gameState="menu";navTab="play";
                    showMsg("✅ Deck saved! "+playerData.selectedDeck.length+" machines selected");
                }
                return;
            }
            // Back button
            if(mx>15&&mx<85&&my>H-55&&my<H-17){gameState="menu";navTab="play";return}

            // Card clicks
            let owned=playerData.unlockedMachines;
            let cardW=isSmall?100:130,cardH=isSmall?110:140,gap=8;
            let cols=Math.floor((W-20)/(cardW+gap));
            let startX=W/2-(Math.min(cols,owned.length)*(cardW+gap))/2;
            let startY=90;
            owned.forEach((mid,i)=>{
                let col=i%cols,row=Math.floor(i/cols);
                let cx=startX+col*(cardW+gap),cy=startY+row*(cardH+gap)-storeScroll;
                if(mx>cx&&mx<cx+cardW&&my>cy&&my<cy+cardH){
                    let idx=playerData.selectedDeck.indexOf(mid);
                    if(idx>=0){
                        // Remove from deck
                        playerData.selectedDeck.splice(idx,1);
                        showMsg("Removed "+ALL_MACHINES[mid].name+" from deck");
                    }else{
                        // Add to deck (max 5)
                        if(playerData.selectedDeck.length<5){
                            playerData.selectedDeck.push(mid);
                            showMsg("Added "+ALL_MACHINES[mid].name+" ("+playerData.selectedDeck.length+"/5)");
                        }else{
                            showMsg("❌ Deck full! Remove one first");
                        }
                    }
                }
            });
            return;
        }

        // STORE
        if(gameState==="store"){
            if(mx>W/2-50&&mx<W/2+50&&my>H-40&&my<H-10){triggerSave();gameState="menu";navTab="play";return}
            let tabs=["Common","Uncommon","Rare","Epic","Legendary","Mythic","My Machines"];
            let tabW=Math.floor((W-12)/tabs.length);
            tabs.forEach((tab,i)=>{if(mx>6+i*tabW&&mx<6+(i+1)*tabW&&my>54&&my<82){storeTab=tab;storeScroll=0}});

            let machines=storeTab==="My Machines"?playerData.unlockedMachines.map(id=>ALL_MACHINES[id]):ALL_MACHINES.filter(m=>m.tier===storeTab);
            let minCardW=isSmall?130:155;
            let cols=Math.max(1,Math.floor((W-16)/minCardW));
            let cardW=Math.floor((W-16-(cols-1)*8)/cols);
            let cardH=isSmall?185:200,gap=8,startX=8,startY=isSmall?82:88;

            machines.forEach((m,i)=>{
                let col=i%cols,row=Math.floor(i/cols);
                let cx=startX+col*(cardW+gap),cy=startY+row*(cardH+gap)-storeScroll;
                if(cy+cardH<82||cy>H-45)return;
                if(storeTab==="My Machines"){
                    let uL=playerData.machineUpgrades[m.id]||0;
                    if(uL<3&&mx>cx+6&&mx<cx+cardW-6&&my>cy+130&&my<cy+158){
                        let cost=m.upgCost[uL];
                        if(gems>=cost){gems-=cost;playerData.machineUpgrades[m.id]=uL+1;triggerSave();showMsg("⬆️ "+m.name+" → Lv"+(uL+1))}
                        else showMsg("❌ Need 💎"+cost);
                    }
                }else{
                    let isO=playerData.unlockedMachines.includes(m.id);
                    if(!isO&&mx>cx+6&&mx<cx+cardW-6&&my>cy+130&&my<cy+158){
                        if(gems>=m.unlockCost){gems-=m.unlockCost;playerData.unlockedMachines.push(m.id);triggerSave();showMsg("🔓 "+m.name+" unlocked!")}
                        else showMsg("❌ Need 💎"+m.unlockCost);
                    }
                }
            });
            return;
        }

        // PROFILE
        if(gameState==="profile"){
            if(!isGuest&&mx>W/2-80&&mx<W/2+80&&my>410&&my<450){signOut()}
            return;
        }

        // END SCREENS
        if(gameState==="gameWon"||gameState==="gameOver"){let won=gameState==="gameWon",bw=170,bx=W/2-bw/2,bh=40;if(won&&mx>bx&&mx<bx+bw&&my>H/2+25&&my<H/2+65){startLevel(currentLevel+1);return}if(mx>bx&&mx<bx+bw&&my>H/2+(won?75:20)&&my<H/2+(won?115:60)){startLevel(currentLevel);return}if(mx>bx&&mx<bx+bw&&my>H/2+(won?125:70)&&my<H/2+(won?165:110)){triggerSave();gameState="menu";navTab="play";return}return}

        // PLAYING
        if(gameState!=="playing")return;
        let topH=getTopH(),botH=getBotH(),pbW=isSmall?30:42;
        if(mx>W-pbW-4&&mx<W-4&&my>4&&my<4+topH-8){gameState="paused";return}

        let panelY=H-botH;
        if(my>panelY){
            let deck=playerData.selectedDeck;
            let wbW=isSmall?90:115,btnW=isSmall?48:60,gap=3;
            let maxVis=Math.floor((W-wbW-20)/(btnW+gap));
            let vis=Math.min(deck.length,maxVis);
            for(let i=0;i<vis;i++){let bx=5+i*(btnW+gap),by=panelY+7;if(mx>bx&&mx<bx+btnW&&my>by&&my<by+botH-14){selectedMachineId=deck[i];selectedPlacedTower=null}}
            let wbx=W-wbW-6,wby=panelY+7;
            if(mx>wbx&&mx<wbx+wbW&&my>wby&&my<wby+botH-14&&!waveActive)startWave();
            return;
        }
        if(my<topH)return;

        // Tower info panel clicks
        if(selectedPlacedTower){let t=selectedPlacedTower,pW=190,pH=155,pX=Math.min(t.x-cam.x+30,W-pW-10),pY=Math.max(topH+5,Math.min(t.y-cam.y-pH/2,H-pH-botH-10));let bY=pY+72;if(t.hp<t.maxHp){let rc=Math.floor((t.maxHp-t.hp)*0.3);if(mx>pX+8&&mx<pX+pW-8&&my>bY&&my<bY+22){if(gameCoins>=rc){gameCoins-=rc;t.hp=t.maxHp;showMsg("🔧 Repaired!")}return}bY+=26}if(mx>pX+8&&mx<pX+pW-8&&my>bY&&my<bY+22){let sv=Math.floor(getPlaceCost(t.machineId)*0.4);gameCoins+=sv;towers=towers.filter(tw=>tw!==t);selectedPlacedTower=null;showMsg("🗑 Sold +🪙"+sv);return}}

        let worldX=mx+cam.x,worldY=my+cam.y,col=Math.floor(worldX/CELL),row=Math.floor(worldY/CELL);
        let clicked=towers.find(t=>t.col===col&&t.row===row);
        if(clicked){selectedPlacedTower=selectedPlacedTower===clicked?null:clicked;return}
        selectedPlacedTower=null;
        if(towers.length>=getMaxOnMap()){showMsg("❌ Max "+getMaxOnMap()+"! Sell one first.");return}
        if(validP(col,row)){let pc=getPlaceCost(selectedMachineId);if(gameCoins>=pc){gameCoins-=pc;let st=getMStats(selectedMachineId);towers.push({x:col*CELL+CELL/2,y:row*CELL+CELL/2,col,row,machineId:selectedMachineId,name:st.name,baseColor:st.color,range:st.range,damage:st.damage,fireRate:st.fireRate,bulletSpeed:st.bulletSpeed,bulletColor:st.bulletColor,slow:st.slow||false,splash:st.splash||false,chain:st.chain||false,burn:st.burn||false,poison:st.poison||false,isWall:st.isWall||false,healer:st.healer||false,hp:st.maxHp,maxHp:st.maxHp,angle:0,damageFlash:0});showMsg(st.name+" placed! 🪙-"+pc)}else showMsg("❌ Need 🪙"+pc)}
    }

    canvas.addEventListener("click",e=>{if(!isMapDragging)handleClick(e.clientX,e.clientY)});

    // =================== TOUCH ===================
    canvas.addEventListener("touchstart",e=>{
        e.preventDefault();
        let t=e.touches[0];
        touchStartX=t.clientX;touchStartY=t.clientY;
        touchStartTime=Date.now();
        if(gameState==="playing"){
            mapDragStart={x:t.clientX,y:t.clientY};
            mapCamStart={x:cam.x,y:cam.y};
        }
        touchMoved=false;
    },{passive:false});

    canvas.addEventListener("touchmove",e=>{
        e.preventDefault();
        let t=e.touches[0];
        let dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
        if(Math.abs(dx)>10||Math.abs(dy)>10)touchMoved=true;
        if(gameState==="playing"&&touchMoved){
            cam.x=Math.max(0,Math.min(mapCols*CELL-W,mapCamStart.x-(t.clientX-mapDragStart.x)));
            cam.y=Math.max(0,Math.min(mapRows*CELL-(H-getBotH()-getTopH()),mapCamStart.y-(t.clientY-mapDragStart.y)));
        }
        if((gameState==="store"||gameState==="deckBuilder")&&touchMoved){
            storeScroll=Math.max(0,storeScroll-dy*0.4);
            touchStartX=t.clientX;touchStartY=t.clientY;
        }
    },{passive:false});

    canvas.addEventListener("touchend",e=>{
        e.preventDefault();
        let elapsed=Date.now()-touchStartTime;
        if(!touchMoved&&elapsed<350){let t=e.changedTouches[0];handleClick(t.clientX,t.clientY)}
        touchMoved=false;
    },{passive:false});

    // =================== MAIN LOOP ===================
    let lastFrame=0;
    function update(ts){
        if(ts-lastFrame<14){requestAnimationFrame(update);return}
        lastFrame=ts;frame++;

        if(gameState==="menu"){drawMenu();requestAnimationFrame(update);return}
        if(gameState==="levelSelect"){drawLevelScreen();requestAnimationFrame(update);return}
        if(gameState==="deckBuilder"){drawDeckBuilder();requestAnimationFrame(update);return}
        if(gameState==="store"){drawStore();requestAnimationFrame(update);return}
        if(gameState==="profile"){drawProfile();requestAnimationFrame(update);return}
        if(gameState==="paused"){
            let level=genLvl(currentLevel);ctx.fillStyle=level.bg;ctx.fillRect(0,0,W,H);
            let sC=Math.floor(cam.x/CELL),sR=Math.floor(cam.y/CELL);
            ctx.strokeStyle="rgba(0,0,0,0.12)";ctx.lineWidth=0.5;
            for(let c=sC;c<sC+Math.ceil(W/CELL)+2;c++)for(let r=sR;r<sR+Math.ceil(H/CELL)+2;r++)ctx.strokeRect(c*CELL-cam.x,r*CELL-cam.y,CELL,CELL);
            drawPath();towers.forEach(t=>drawT(t));
            enemies.forEach(e=>{let sx=e.x-cam.x,sy=e.y-cam.y;if(sx>-40&&sx<W+40&&sy>-40&&sy<H+40)drawEI(sx,sy,e)});
            drawHUD();drawPause();requestAnimationFrame(update);return;
        }
        if(gameState==="gameOver"){drawEnd(false);requestAnimationFrame(update);return}
        if(gameState==="gameWon"){drawEnd(true);requestAnimationFrame(update);return}

        // PLAYING
        ctx.fillStyle=genLvl(currentLevel).bg;ctx.fillRect(0,0,W,H);
        let sC=Math.floor(cam.x/CELL),sR=Math.floor(cam.y/CELL);
        ctx.strokeStyle="rgba(0,0,0,0.10)";ctx.lineWidth=0.5;
        for(let c=sC;c<sC+Math.ceil(W/CELL)+2;c++)for(let r=sR;r<sR+Math.ceil(H/CELL)+2;r++)ctx.strokeRect(c*CELL-cam.x,r*CELL-cam.y,CELL,CELL);

        drawPath();
        if(!isMobile)drawPrev();
        towers.forEach(t=>{tShoot(t);drawT(t)});

        // SPAWN - more enemy types earlier
        if(waveActive){
            spawnTimer++;
            if(spawnTimer%Math.max(15,38-currentLevel)===0&&enemiesSpawned<enemiesInWave){
                let types=["basic","basic","basic"];
                if(wave>=2||currentLevel>=2)types.push("fast","fast");
                if(wave>=2||currentLevel>=4)types.push("tank");
                if(wave>=3||currentLevel>=6)types.push("flying","flying");
                if(wave>=2||currentLevel>=8)types.push("bomber");
                if(currentLevel>=10)types.push("healer");
                if(currentLevel>=12)types.push("armored");
                if(currentLevel>=18)types.push("ghost","speedster");
                if(currentLevel>=25)types.push("berserker","berserker");
                let type=types[Math.floor(Math.random()*types.length)];
                if(enemiesSpawned===enemiesInWave-1&&(wave%3===0||wave===totalWaves))
                    type=currentLevel>=50?"mega":"boss";
                enemies.push(createE(type,wave));enemiesSpawned++;
            }
            if(enemiesSpawned>=enemiesInWave&&enemies.length===0){
                waveActive=false;
                let cB=30+wave*8+currentLevel*3,gB=Math.floor(wave*2)+Math.floor(currentLevel/2);
                gameCoins+=cB;gems+=gB;totalGems+=gB;triggerSave();
                showMsg("✅ Wave "+wave+" 🪙+"+cB+" 💎+"+gB);
                if(wave>=totalWaves){let wG=25+currentLevel*4;gems+=wG;totalGems+=wG;if(currentLevel+2>playerData.maxLevel)playerData.maxLevel=currentLevel+2;triggerSave();gameState="gameWon"}
            }
        }

        enemies=enemies.filter(e=>{
            let reached=moveE(e);
            if(reached){escaped++;showMsg("💀 "+escaped+"/"+lives);if(escaped>=lives){triggerSave();gameState="gameOver"}return false}
            if(e.hp<=0){gameCoins+=e.reward;gems+=e.gemReward;score+=e.reward;totalGems+=e.gemReward;spawnP(e.x-cam.x,e.y-cam.y,"#FFD700","🪙+"+e.reward);if(e.gemReward>0)spawnP(e.x-cam.x,e.y-cam.y+15,"#E040FB","💎+"+e.gemReward);for(let i=0;i<5;i++)particles.push({x:e.x-cam.x,y:e.y-cam.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,color:e.color,size:3,life:25,maxLife:25});return false}
            let sx=e.x-cam.x,sy=e.y-cam.y;
            if(sx>-40&&sx<W+40&&sy>-40&&sy<H+40){drawEI(sx,sy,e);let bw=e.size*2.2,hpP=Math.max(0,e.hp/e.maxHp);ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(sx-bw/2,sy-e.size-10,bw,4);ctx.fillStyle=hpP>0.6?"#2ecc71":hpP>0.3?"#f39c12":"#e74c3c";ctx.fillRect(sx-bw/2,sy-e.size-10,bw*hpP,4)}
            return true;
        });

        bullets=bullets.filter(b=>{b.x+=b.vx;b.y+=b.vy;let sx=b.x-cam.x,sy=b.y-cam.y;ctx.shadowColor=b.color;ctx.shadowBlur=5;ctx.beginPath();ctx.arc(sx,sy,b.size,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();ctx.shadowBlur=0;let hit=false;enemies.forEach(e=>{if(Math.sqrt((b.x-e.x)**2+(b.y-e.y)**2)<e.size+b.size){if(b.splash)splashD(b.x,b.y,b.damage,80);else if(b.chain){e.hp-=b.damage;chainH(b.x,b.y,b.damage)}else e.hp-=b.damage;if(b.slow)e.slowed=90;if(b.burn)e.burning=120;if(b.poison)e.poisoned=100;if(!b.splash&&!b.chain)spawnP(e.x-cam.x,e.y-cam.y-10,"#e74c3c","-"+b.damage);hit=true}});if(b.x<cam.x-100||b.x>cam.x+W+100||b.y<cam.y-100||b.y>cam.y+H+100)hit=true;return!hit});

        particles=particles.filter(p=>{p.life--;p.y+=(p.vy||-1);if(p.vx)p.x+=p.vx;ctx.globalAlpha=p.life/p.maxLife;if(p.text){ctx.fillStyle=p.color;ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText(p.text,p.x,p.y)}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size||3,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill()}ctx.globalAlpha=1;return p.life>0});

        drawHUD();drawMM();drawTI();

        if(messageTimer>0){messageTimer--;ctx.globalAlpha=Math.min(1,messageTimer/30);let mw=Math.min(isSmall?300:420,W-20);rr(W/2-mw/2,getTopH()+5,mw,28,8,"rgba(0,0,0,0.88)","rgba(255,255,255,0.15)");ctx.fillStyle="white";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText(message,W/2,getTopH()+23);ctx.globalAlpha=1}

        requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
}
</script>

<script>
if('serviceWorker' in navigator){
    window.addEventListener('load',async()=>{
        try{
            const reg=await navigator.serviceWorker.register('/sw.js');
            reg.addEventListener('updatefound',()=>{
                const sw=reg.installing;
                sw.addEventListener('statechange',()=>{
                    if(sw.state==='installed'&&navigator.serviceWorker.controller){sw.postMessage('skipWaiting');window.location.reload()}
                });
            });
        }catch(e){console.log('SW:',e)}
    });
}
</script>
</body>
