        body {

            touch-action: none;
            user-select: none;

        canvas {

        #ui {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #050510, #1a1a3a)

        .box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 35px;
            width: min(380px, 92vw);
            backdrop-filter: blur(10px)
        }

        .logo {
            color: #f1c40f;
            font-family: Arial;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px

        .sub {
            color: #aaa;
            font-family: Arial;
            font-size: 13px;
            text-align: center;
            margin-bottom: 22px
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            font-family: Arial;
            margin-bottom: 10px;
            outline: none;
            box-sizing: border-box;
            transition: border 0.2s
        }

        input:focus {
            border-color: #f1c40f
        }

        input::placeholder {
            color: #666
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            font-family: Arial;
            cursor: pointer;
            margin-bottom: 8px;
            transition: opacity 0.2s;
            box-sizing: border-box

        .btn:hover {
            opacity: 0.88

        .btn:active {
            opacity: 0.75

        .btn-green {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: white
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.07);
            color: #aaa;
            font-size: 13px
        }

        .err {
            color: #e74c3c;
            font-family: Arial;
            font-size: 12px;
            text-align: center;
            margin-bottom: 8px;
            min-height: 16px

            color: #aaa;
            font-family: Arial;
            font-size: 13px;
            text-align: center;

            font-weight: bold

            font-family: Arial;

    <!-- Auth UI -->

                game...</p>

        </div>

    <script>
        // ================================================
        // 🔧 PUT YOUR SUPABASE DETAILS HERE
        // ================================================
        const SUPABASE_URL = "https://rlohtodqxxgwveeahmzz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_D9MV9BJ9eFq1FEdbEu_J7g_xOEcynW8";
        // ================================================

        let supabaseClient, currentUser, isGuest = false;
        let authMode = "signin";

        // Initialize right away since script is already loaded in <head>
        function initSupabase() {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("✅ Supabase connected!");
                checkSession();
            } catch (e) {
                console.error("❌ Supabase error:", e);
                // Show error to user
                document.getElementById('errMsg').textContent = "Connection failed. Check your URL and Key.";
                hideLoad();
            }
        }

        // Auto init when page loads
        window.addEventListener('load', initSupabase);
        async function checkSession() {
            showLoad("Checking login...");
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await loadAndStart();
            } else {
                hideLoad();
            }

            // Listen for auth changes
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    currentUser = session.user;
                    await loadAndStart();
                }
                if (event === 'SIGNED_OUT') {
                    currentUser = null;
                    document.getElementById('ui').style.display = 'flex';
                    document.getElementById('authBox').style.display = 'block';
                    hideLoad();
                }
            });
        }

        function switchTab(mode) {
            authMode = mode;
            document.getElementById('tabSignin').className = 'tab' + (mode === 'signin' ? ' active' : '');
            document.getElementById('tabSignup').className = 'tab' + (mode === 'signup' ? ' active' : '');
            document.getElementById('nameInp').style.display = mode === 'signup' ? 'block' : 'none';
            document.getElementById('mainBtn').textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
            document.getElementById('swText').innerHTML = mode === 'signup' ?
                'Have account? <span onclick="switchTab(\'signin\')">Sign In</span>' :
                'No account? <span onclick="switchTab(\'signup\')">Sign Up</span>';
            setErr('');
        }

        function setErr(m) { document.getElementById('errMsg').textContent = m }
        function showLoad(m) {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('loadBox').style.display = 'block';
            document.getElementById('loadMsg').textContent = m || 'Loading...';
        }
        function hideLoad() {
            document.getElementById('loadBox').style.display = 'none';
            document.getElementById('authBox').style.display = 'block';
        }

        async function doAuth() {
            setErr('');
            let email = document.getElementById('emailInp').value.trim();
            let pass = document.getElementById('passInp').value;
            let name = document.getElementById('nameInp').value.trim();

            if (!email || !pass) { setErr('Please fill email and password'); return }
            if (pass.length < 6) { setErr('Password must be 6+ characters'); return }
            if (authMode === 'signup' && !name) { setErr('Please enter your name'); return }

            document.getElementById('mainBtn').textContent = 'Please wait...';
            document.getElementById('mainBtn').disabled = true;

            try {
                if (authMode === 'signup') {
                    let { data, error } = await supabaseClient.auth.signUp({
                        email, password: pass,
                        options: { data: { display_name: name } }
                    });
                    if (error) throw error;
                    if (data.user && !data.session) {
                        setErr('✅ Check your email to confirm your account!');
                        document.getElementById('mainBtn').textContent = 'Create Account';
                        document.getElementById('mainBtn').disabled = false;
                        return;
                    }
                } else {
                    let { error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
                    if (error) throw error;
                }
            } catch (e) {
                let msg = e.message;
                if (msg.includes('Invalid login')) msg = 'Wrong email or password';
                if (msg.includes('already registered')) msg = 'Email already in use';
                if (msg.includes('valid email')) msg = 'Please enter valid email';
                setErr(msg);
                document.getElementById('mainBtn').textContent = authMode === 'signup' ? 'Create Account' : 'Sign In';
                document.getElementById('mainBtn').disabled = false;
            }
        }

        async function doGuest() {
            isGuest = true;
            document.getElementById('ui').style.display = 'none';
            startGame({

                max_level: 1,
                unlocked_machines: [0, 1, 2],
                machine_upgrades: {},
                total_gems: 0,
                display_name: 'Guest'
            });
        }

        async function loadAndStart() {
            showLoad("Loading your save data...");
            document.getElementById('ui').style.display = 'flex';

            try {
                let { data, error } = await supabaseClient
                    .from('game_saves')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .single();

                if (error && error.code === 'PGRST116') {
                    // No save found, create one
                    let newSave = {
                        user_id: currentUser.id,
                        gems: 50,
                        max_level: 1,
                        unlocked_machines: [0, 1, 2],
                        machine_upgrades: {},
                        total_gems: 0,
                        display_name: currentUser.user_metadata?.display_name ||
                            currentUser.email?.split('@')[0] || 'Player'
                    };
                    let { data: created } = await supabase.from('game_saves').insert(newSave).select().single();
                    data = created || newSave;
                }

                document.getElementById('ui').style.display = 'none';
                startGame(data || { gems: 50, max_level: 1, unlocked_machines: [0, 1, 2], machine_upgrades: {}, total_gems: 0 });
            } catch (e) {
                console.log('Load error:', e);
                document.getElementById('ui').style.display = 'none';
                startGame({ gems: 50, max_level: 1, unlocked_machines: [0, 1, 2], machine_upgrades: {}, total_gems: 0 });
            }
        }

        // Auto save function (called from game)
        let saveTimeout = null;
        async function saveGame(data) {
            if (isGuest || !currentUser) return;

            // Debounce saves
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    await supabaseClient.from('game_saves').upsert({
                        user_id: currentUser.id,
                        gems: data.gems || 0,
                        max_level: data.maxLevel || 1,
                        unlocked_machines: data.unlockedMachines || [0, 1, 2],
                        machine_upgrades: data.machineUpgrades || {},
                        total_gems: data.totalGems || 0,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });
                    console.log('💾 Saved!');
                } catch (e) {
                    console.log('Save error:', e);
                }
            }, 1500);
        }

                machineUpgrades: window.gameMachineUpgrades || {},
                totalGems: window.gameTotalGems || 0
            });
            await supabaseClient.auth.signOut();
            location.reload();
        }
