name: 🏰 Build Tower Defense APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Add permissions here
permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    # Also add here
    permissions:
      contents: write
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 📦 Install Dependencies
      run: npm install
    
    - name: 📁 Create www folder
      run: |
        mkdir -p www
        cp index.html www/index.html 2>/dev/null || true
        cp manifest.json www/manifest.json 2>/dev/null || true
        cp sw.js www/sw.js 2>/dev/null || true
        cp icon-192.png www/icon-192.png 2>/dev/null || true
        cp icon-512.png www/icon-512.png 2>/dev/null || true
        echo "✅ www folder:"
        ls -la www/
    
    - name: ➕ Add Android Platform
      run: npx cap add android
    
    - name: 📋 Copy Web Files
      run: npx cap copy android
    
    - name: 🔧 Sync Capacitor
      run: npx cap sync android
    
    - name: 🔨 Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: ✅ Check APK exists
      run: |
        echo "Checking APK..."
        ls -la android/app/build/outputs/apk/debug/
        echo "APK found! ✅"
    
    - name: 📤 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TowerDefense-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: 🏷️ Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: "🏰 Tower Defense v${{ github.run_number }}"
        body: |
          ## 📱 How to Install:
          1. Download `app-debug.apk` below
          2. On Android: Settings → Security → Allow unknown sources
          3. Open downloaded APK → Install
          4. Play! 🎮
          
          ## ✅ Features:
          - 50 unique machines
          - 200 levels  
          - Cloud save
          - Auto-updates
        files: android/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
