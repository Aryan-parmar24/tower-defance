name: 🏰 Build Tower Defense APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 📦 Install Dependencies
      run: npm install
    
    - name: 📁 Create www folder
      run: |
        mkdir -p www
        cp index.html www/index.html 2>/dev/null || true
        cp manifest.json www/manifest.json 2>/dev/null || true
        cp sw.js www/sw.js 2>/dev/null || true
        cp icon-192.png www/icon-192.png 2>/dev/null || true
        cp icon-512.png www/icon-512.png 2>/dev/null || true
        echo "✅ www folder contents:"
        ls -la www/
    
    - name: ➕ Add Android Platform
      run: npx cap add android
    
    - name: 📋 Copy Web Files
      run: npx cap copy android
    
    - name: 🔧 Sync Capacitor
      run: npx cap sync android
    
    - name: 🔨 Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TowerDefense-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: 🏷️ Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "🏰 Tower Defense v${{ github.run_number }}"
        body: |
          ## 📱 Install:
          1. Download APK below
          2. Allow unknown sources on Android
          3. Install and play!
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
